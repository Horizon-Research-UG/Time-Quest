name: Deploy Münzwurf to GitHub Pages

# Automatisches Deployment des Muenzwurf Ordners | Zeile 1
# Läuft bei jedem Push auf main Branch | Zeile 2  
# Verbunden mit: Muenzwurf/index.html als Ziel | Zeile 3

on:
  push: # Bei Push Event | Zeile 5: Git Push Trigger
    branches: [ main ] # Nur main Branch | Zeile 6: nur bei main Branch
  workflow_dispatch: # Manueller Start | Zeile 7: händisch startbar

permissions: # GitHub Berechtigungen | Zeile 9
  contents: read # Lesen erlaubt | Zeile 10: Repository lesen
  pages: write # Pages schreiben | Zeile 11: GitHub Pages deployment
  id-token: write # Token schreiben | Zeile 12: Authentifizierung

concurrency: # Nebenläufigkeit | Zeile 14
  group: "pages" # Gruppe Pages | Zeile 15: nur ein Deployment gleichzeitig
  cancel-in-progress: false # Nicht abbrechen | Zeile 16: laufende nicht stoppen

jobs: # Jobs Definition | Zeile 18
  deploy: # Deploy Job | Zeile 19: Hauptjob Name
    environment: # Environment | Zeile 20: GitHub Pages Environment
      name: github-pages # Name | Zeile 21: Standard GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }} # URL | Zeile 22: von deployment step
    runs-on: ubuntu-latest # OS | Zeile 23: Ubuntu Runner
    steps: # Schritte | Zeile 24: Arbeitsschritte
    - name: Checkout # Code holen | Zeile 25: Repository downloaden
      uses: actions/checkout@v4 # Action | Zeile 26: offizielle Checkout Action
      
    - name: Setup Pages # Pages Setup | Zeile 28: GitHub Pages vorbereiten
      uses: actions/configure-pages@v4 # Action | Zeile 29: Pages Action
      
    - name: Upload artifact # Artifact Upload | Zeile 31: Muenzwurf Ordner hochladen
      uses: actions/upload-pages-artifact@v3 # Action | Zeile 32: Upload Action
      with: # Parameter | Zeile 33: Action Parameter
        path: './Muenzwurf' # Pfad | Zeile 34: nur Muenzwurf Ordner
        
    - name: Deploy to GitHub Pages # Deployment | Zeile 36: Live schalten
      id: deployment # ID | Zeile 37: für URL Referenz Zeile 22
      uses: actions/deploy-pages@v4 # Action | Zeile 38: Deploy Action