<!DOCTYPE html>
<!-- Münzwurf-Spiel für GitHub Pages -->
<!-- Statische Version ohne Server -->
<!-- Verbunden mit: muenz-style.css (Zeile 9) -->

<html lang="de">
<head>
    <meta charset="UTF-8"> <!-- Zeichensatz definieren -->
    <link rel="stylesheet" href="muenz-style.css"> <!-- Münz-Stylesheet laden -->
    <title>Münzwurf Spiel</title> <!-- Seitentitel setzen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive Design -->
</head>
<body>
    <h1>Münzwurf Spiel</h1> <!-- Hauptüberschrift -->
    
    <!-- Spielbereich Container -->
    <!-- Wird von: muenz-animation.js manipuliert -->
    <div id="spiel-container">
        <!-- Münze Element -->
        <!-- Verbunden mit: muenz-animation.js (Zeile wird definiert) -->
        <div id="muenze" class="muenze-bereit">💰</div>
        
        <!-- Steuerung -->
        <!-- Verbunden mit: muenz-steuerung.js -->
        <div id="steuerung-panel">
            <label>Dreh-Dauer:</label> <!-- Label für Slider -->
            <input type="range" id="dreh-slider" min="1" max="10" value="5"> <!-- Drehzeit-Regler -->
            <span id="dreh-wert">5</span> Sekunden <!-- Aktueller Wert -->
        </div>
        
        <!-- Anleitung -->
        <!-- Hilft Benutzern beim ersten Besuch -->
        <div id="anleitung">
            <p>🎯 Klicke auf die Münze zum Werfen!</p> <!-- Spielanleitung -->
            <p>⏱️ Stelle die Drehzeit mit dem Regler ein</p> <!-- Slider-Hilfe -->
        </div>
    </div>
    
    <!-- JavaScript laden -->
    <!-- Verbunden mit: muenz-animation.js -->
    <script src="muenz-animation.js"></script>
    <!-- Verbunden mit: muenz-steuerung.js -->  
    <script src="muenz-steuerung.js"></script>
</body>
</html>
