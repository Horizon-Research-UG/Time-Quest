<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Münzwurf - Neu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="muenze" class="muenze">2</div>
        
        <div class="regler">
            <label for="drehzeit">Drehdauer: <span id="zeit-anzeige">3</span> Sekunden</label>
            <input type="range" id="drehzeit" min="1" max="10" value="3" step="0.5">
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
